name: CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# Publishing is not cancelled halfway; a newer push simply publishes after.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks a pull request runs, called as a reusable workflow rather than
  # repeated here, so nothing is ever published from a commit that did not pass
  # them.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to ghcr.io
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What lets the built-in GITHUB_TOKEN push to ghcr.io. No other credential
      # is involved: the registry is the repository's own.
      packages: write
      # The two the provenance attestation needs: an OIDC token to sign with, and
      # the right to record the result against the repository.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The tags the image gets: the branch name, the commit SHA, `latest` on the
      # default branch, and the semver of a `v*` tag when the push is one. The
      # labels and annotations it derives point the package back at this
      # repository and commit, which is also what links it to the repository on
      # GitHub's packages page.
      # @see https://github.com/docker/metadata-action
      - name: Compute tags, labels and annotations
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Cross-building the arm64 variant, since a laptop on Apple silicon and most
      # of the cheap server fleets are not x86.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Immediately before the only step that needs it, so the registry credential
      # is not in the environment of anything else.
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM and the SLSA provenance ride along in the manifest, so what the
      # image contains and how it was built can be answered from the registry
      # alone.
      # @see https://docs.docker.com/build/attestations/
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The signed, Sigstore-backed counterpart of the provenance above: it is
      # what `gh attestation verify` checks, so anyone pulling the image can tie
      # the digest back to this workflow and this commit.
      # @see https://docs.github.com/actions/security-for-github-actions/using-artifact-attestations
      - name: Attest the published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Through the environment rather than interpolated into the script: a
      # `${{ }}` in a `run` block is substituted before the shell ever sees it, so
      # anything quote-shaped in the value would be running as code by then. These
      # two are computed from the ref and the digest and could not be, but the
      # habit is what keeps the one that could from being written the same way.
      # @see https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
      - name: Summarise what was published
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
