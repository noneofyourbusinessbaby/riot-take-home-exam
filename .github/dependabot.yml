version: 2

# Three ecosystems, because three files pin versions that go stale: the manifest,
# the workflows and the Dockerfile's base image. Updates are grouped per ecosystem
# so the week brings one pull request to review per ecosystem rather than one per
# package, and CI answers each of them the same way it answers any other change.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Reads the one `FROM node:…` line the Dockerfile declares. The Node version
  # also lives in `.nvmrc`, which nothing updates automatically, so a bump here is
  # the reminder to move that file with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
