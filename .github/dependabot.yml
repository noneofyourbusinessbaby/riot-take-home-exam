version: 2

# Group each ecosystem so weekly updates arrive as one pull request.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # A Docker update is also the reminder to keep `.nvmrc` aligned.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
